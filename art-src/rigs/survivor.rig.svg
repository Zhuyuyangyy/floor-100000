<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96"
     data-codeart="rig.v1" data-anchor="32 95" data-facing="right" data-outline="#05080b">
  <!-- Survivor rig (codeart2d, no image model). 64x96 frame, ground line y=95.
       Proportions taken from the approved master still, which traces to a figure
       37px wide by 94px tall inside its band - so this rig spans x 10..46 and
       y 8..95, not a generic 17x82. The width is mostly the backpack: it is the
       widest thing in the silhouette and the reason the figure reads at a glance.

       Teal-green hooded jacket, canvas backpack with a bedroll on top, dark
       trousers, heavy boots, facing right.

       Bone lengths keep the gait reachable: leg L = 34 (thigh 17 + shin 17),
       hip height 37, so sqrt(37^2 + e^2) < 34 is the binding limit and the
       half-step stays under ~6px - hence stride 14 rather than 24. -->
  <style>
    .c-out{stroke:#05080b;stroke-width:1}
    .c-hood{fill:#2f6b5e} .c-hood-hi{fill:#77c6a4} .c-hood-sh{fill:#1e4a44}
    .c-skin{fill:#d9b48f} .c-skin-sh{fill:#a5714c}
    .c-hair{fill:#05080b}
    .c-pants{fill:#47657a} .c-pants-sh{fill:#2c3f4e}
    .c-boot{fill:#8a4a1e} .c-boot-sh{fill:#05080b}
    .c-pack{fill:#8a4a1e} .c-pack-sh{fill:#2c3f4e} .c-roll{fill:#2f6b5e}
    .c-ink{fill:#05080b}
  </style>

  <g id="root" data-pivot="32 95">
    <g id="hips" data-pivot="30 58">

      <!-- ══ back leg (far side): darker, behind the torso ══ -->
      <g id="thigh_b" data-pivot="29 58" data-z="10">
        <rect class="c-pants-sh c-out" x="26.25" y="56.5" width="5.5" height="17" rx="2.5"/>
        <g id="shin_b" data-pivot="29 75">
          <rect class="c-pants-sh c-out" x="26.75" y="73.5" width="4.5" height="16" rx="2"/>
          <g id="foot_b" data-pivot="29 91" data-z="11">
            <rect class="c-boot-sh c-out" x="25.5" y="89.5" width="10" height="5" rx="1.5"/>
          </g>
        </g>
      </g>

      <g id="torso" data-pivot="30 58">

        <!-- ══ the backpack: the widest thing in the silhouette ══ -->
        <!-- a bone, so the walk can bob it against the torso -->
        <g id="pack" data-pivot="20 58" data-z="8">
          <!-- bedroll lashed on top: one shape, not two overlapping -->
          <rect class="c-roll c-out" x="12" y="27" width="17" height="9" rx="4"/>
          <!-- pack body, with its shadow read as a band rather than a second box -->
          <rect class="c-pack c-out" x="10" y="35" width="20" height="24" rx="3"/>
          <rect class="c-pack-sh" x="10" y="46" width="20" height="13"/>
          <!-- compression strap and its buckle -->
          <rect class="c-ink" x="10" y="43" width="20" height="2"/>
          <rect class="c-hood-hi" x="18" y="42.5" width="4" height="3"/>
        </g>

        <!-- ══ back arm: behind everything ══ -->
        <g id="arm_b" data-pivot="28 42" data-z="5">
          <rect class="c-hood-sh c-out" x="26" y="40.5" width="5" height="8" rx="2"/>
          <g id="fore_b" data-pivot="28 48">
            <rect class="c-skin-sh c-out" x="26" y="46.5" width="4.5" height="7" rx="2"/>
          </g>
        </g>

        <!-- ══ torso: the hooded jacket ══ -->
        <rect data-z="30" class="c-hood c-out" x="26" y="32" width="16" height="26" rx="3.5"/>
        <!-- lit column down the front, shadow at the back -->
        <rect data-z="31" class="c-hood-hi" x="27" y="34" width="4" height="22"/>
        <rect data-z="32" class="c-hood-sh" x="37" y="34" width="4" height="22"/>
        <!-- hood bunched behind the neck -->
        <rect data-z="33" class="c-hood-sh c-out" x="24" y="29" width="12" height="7" rx="2.5"/>

        <!-- ══ head ══ -->
        <g id="head" data-pivot="34 32" data-z="40">
          <circle class="c-skin c-out" cx="34" cy="21" r="10"/>
          <!-- hair: a cap of stacked rects. A Bezier path reads better in the
               source but every curve junction emits L-shaped corner pixels, and
               the pixel route gates on those (l_corners, threshold 10). -->
          <rect data-z="41" class="c-hair c-out" x="25" y="9" width="18" height="5" rx="2"/>
          <rect data-z="41" class="c-hair c-out" x="24" y="12" width="14" height="5" rx="2"/>
          <rect data-z="41" class="c-hair c-out" x="24" y="16" width="10" height="6" rx="2"/>
          <!-- face on the leading edge -->
          <rect data-z="42" class="c-ink" x="38.5" y="18" width="2.5" height="3"/>
          <rect data-z="43" class="c-skin-sh" x="38.5" y="22.5" width="2.5" height="2"/>
        </g>

        <!-- ══ front arm: in front of the torso ══ -->
        <g id="arm_f" data-pivot="36 42" data-z="60">
          <rect class="c-hood c-out" x="34" y="40.5" width="5" height="8" rx="2"/>
          <g id="fore_f" data-pivot="36 48">
            <rect class="c-skin c-out" x="34" y="46.5" width="4.5" height="7" rx="2"/>
          </g>
        </g>
      </g>

      <!-- ══ front leg (near side) ══ -->
      <g id="thigh_f" data-pivot="31 58" data-z="50">
        <rect class="c-pants c-out" x="28.25" y="56.5" width="5.5" height="17" rx="2.5"/>
        <g id="shin_f" data-pivot="31 75">
          <rect class="c-pants c-out" x="28.75" y="73.5" width="4.5" height="16" rx="2"/>
          <g id="foot_f" data-pivot="31 91" data-z="51">
            <rect class="c-boot c-out" x="28.5" y="89.5" width="10" height="5" rx="1.5"/>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
