<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96"
     data-codeart="rig.v1" data-anchor="32 95" data-facing="right" data-outline="#05080b">
  <!-- Alin rig (codeart2d, no image model). 64x96 frame, ground line y=95.
       The old neighbour: visibly BROADER than the survivor - the bulk is the
       whole point of him, so the torso and the pack are wider and the stance is
       square, weight even on both feet. Steel-blue worker's overalls over a grey
       undershirt, tool belt with a wrench, rolled sleeves showing forearms, grey
       stubble. Same bone layout as the survivor so the walk cycle and every
       interaction radius stay shared.

       Proportions follow the still: shoulders wider, torso deeper, head slightly
       smaller relative to the body - about 5 heads tall against the survivor's
       5.5. Leg L = 34, hip height 37, so the gait stays reachable. -->
  <style>
    .c-out{stroke:#05080b;stroke-width:1}
    .c-denim{fill:#47657a} .c-denim-hi{fill:#8a95a0} .c-denim-sh{fill:#2c3f4e}
    .c-shirt{fill:#8a95a0}
    .c-skin{fill:#d9b48f} .c-skin-sh{fill:#a5714c}
    .c-hair{fill:#8a95a0}
    .c-boot{fill:#6b4630} .c-boot-sh{fill:#05080b}
    .c-tool{fill:#d98b3c} .c-belt{fill:#6b4630}
    .c-ink{fill:#05080b}
  </style>

  <g id="root" data-pivot="32 95">
    <g id="hips" data-pivot="30 58">

      <!-- ══ back leg (far side): darker, behind the torso ══ -->
      <g id="thigh_b" data-pivot="28 58" data-z="10">
        <rect class="c-denim-sh c-out" x="25.25" y="56.5" width="6" height="17" rx="2.5"/>
        <g id="shin_b" data-pivot="28 75">
          <rect class="c-denim-sh c-out" x="25.75" y="73.5" width="5" height="16" rx="2"/>
          <g id="foot_b" data-pivot="28 91" data-z="11">
            <rect class="c-boot-sh c-out" x="24.5" y="89.5" width="11" height="5" rx="1.5"/>
          </g>
        </g>
      </g>

      <g id="torso" data-pivot="30 58">

        <!-- ══ tool pack on the back: broader than the survivor's, lower ══ -->
        <g id="pack" data-pivot="18 58" data-z="8">
          <rect class="c-denim-sh c-out" x="8" y="38" width="20" height="21" rx="3"/>
          <rect class="c-denim-sh" x="8" y="48" width="20" height="11"/>
          <rect class="c-ink" x="8" y="45" width="20" height="2"/>
          <rect class="c-belt" x="16" y="44.5" width="4" height="3"/>
        </g>

        <!-- ══ back arm: behind everything, rolled sleeve ══ -->
        <g id="arm_b" data-pivot="27 42" data-z="5">
          <rect class="c-denim-sh c-out" x="24.5" y="40.5" width="5.5" height="6" rx="2"/>
          <g id="fore_b" data-pivot="27 47">
            <rect class="c-skin-sh c-out" x="25" y="45.5" width="4.5" height="7" rx="2"/>
          </g>
        </g>

        <!-- ══ torso: overalls over a grey undershirt ══ -->
        <rect data-z="30" class="c-denim c-out" x="24" y="32" width="18" height="26" rx="3"/>
        <rect data-z="31" class="c-denim-hi" x="25" y="34" width="4" height="22"/>
        <rect data-z="32" class="c-denim-sh" x="37" y="34" width="4" height="22"/>
        <!-- the bib and straps of the overalls -->
        <rect data-z="33" class="c-denim-sh" x="26" y="36" width="14" height="10"/>
        <rect data-z="34" class="c-denim-sh" x="27" y="31" width="3" height="8"/>
        <rect data-z="34" class="c-denim-sh" x="36" y="31" width="3" height="8"/>
        <!-- tool belt with a wrench -->
        <rect data-z="35" class="c-belt" x="24" y="50" width="18" height="3"/>
        <rect data-z="36" class="c-tool" x="34" y="48" width="6" height="2"/>

        <!-- ══ head: square jaw, grey stubble ══ -->
        <g id="head" data-pivot="33 32" data-z="40">
          <circle class="c-skin c-out" cx="33" cy="22" r="9.5"/>
          <!-- hair: thin, greying -->
          <rect data-z="41" class="c-hair c-out" x="24" y="11" width="18" height="4" rx="2"/>
          <rect data-z="41" class="c-hair c-out" x="23.5" y="14" width="12" height="4" rx="2"/>
          <!-- stubble along the jaw -->
          <rect data-z="42" class="c-hair" x="30" y="26" width="9" height="4"/>
          <!-- face on the leading edge -->
          <rect data-z="43" class="c-ink" x="37" y="19" width="2.5" height="3"/>
          <rect data-z="44" class="c-skin-sh" x="37" y="23.5" width="2.5" height="2"/>
        </g>

        <!-- ══ front arm: rolled sleeve, bare forearm ══ -->
        <g id="arm_f" data-pivot="37 42" data-z="60">
          <rect class="c-denim c-out" x="34.5" y="40.5" width="5.5" height="6" rx="2"/>
          <g id="fore_f" data-pivot="37 47">
            <rect class="c-skin c-out" x="35" y="45.5" width="4.5" height="7" rx="2"/>
          </g>
        </g>
      </g>

      <!-- ══ front leg (near side) ══ -->
      <g id="thigh_f" data-pivot="32 58" data-z="50">
        <rect class="c-denim c-out" x="29.25" y="56.5" width="6" height="17" rx="2.5"/>
        <g id="shin_f" data-pivot="32 75">
          <rect class="c-denim c-out" x="29.75" y="73.5" width="5" height="16" rx="2"/>
          <g id="foot_f" data-pivot="32 91" data-z="51">
            <rect class="c-boot c-out" x="29.5" y="89.5" width="11" height="5" rx="1.5"/>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
