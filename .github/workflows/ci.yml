name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The merge gate. Typecheck, unit tests and the production build are
  # deterministic: if this job is green, the code compiles, the rules hold and
  # the bundle builds. It does not need a browser, so it stays fast.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  # Browser regression suite. Observability, not the merge gate.
  #
  # Two things used to make this job lie: the browser came from whatever
  # Google Chrome the runner image happened to ship, and the suite ran with
  # 2 parallel workers against one Vite dev server. The pinned Playwright image
  # fixes the browser and the OS libraries; one worker and one retry absorb most
  # of the remaining frame timing noise.
  #
  # It is still not deterministic. The suite drives a real Phaser loop, and a
  # handful of specs (npc trade, wanderer escape) swing between green and red on
  # the same commit: 69-72 of 72 across consecutive runs after the stair timing
  # fix. Gating merges on that would block work for a timing coin flip, so the
  # job reports without blocking, and the flip is tracked as B6-AI-09 in
  # docs/03_TASKS.md. `verify` above is the deterministic gate.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: E2E suite
        run: npm run test:e2e -- --workers=1 --retries=1
      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
