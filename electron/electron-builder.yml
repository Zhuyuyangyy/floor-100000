# AG-76 — electron-builder 三平台配置。
#
# 运行目录约定：必须在 electron/ 目录下执行（npx electron-builder ...），
# 这样 electron/package.json 的 devDependencies（electron + electron-builder，
# 几百 MB）全部落在 electron/node_modules，主工程零污染。
#
# 布局：游戏本体（vite 产物 dist/ 与根 package.json）在上一级目录，所以
# directories.app 指向 ".."。files 模式相对 app 目录解析，因此打进 asar 的
# 是 仓库根/dist/** + 仓库根/electron/*.cjs + 根 package.json——
# 与既有的根目录 electron-builder.yml（AG-47）同一套布局，只是构建入口
# 换到了自包含的 electron/ 包。主进程 main.cjs 里 ../dist 的解析在 dev
# （electron . 从仓库根或 electron/ 启动）与打包后一致成立。

appId: fun.shushubiye.floor100000
productName: Floor100000

directories:
  app: ".."            # 游戏主工程在上一级：dist/ 与根 package.json 在那里
  output: dist-electron # 产物落在 electron/dist-electron/（相对本目录）

files:
  - dist/**/*
  - electron/*.cjs
  - package.json
  # 游戏已由 vite 全量打进 dist/assets（phaser 在 bundle 里），运行时零 node
  # 依赖；node_modules 是 electron-builder 自动带的 prod deps（约 118MB），
  # 显式排除，asar 从 120MB 降到约 2.5MB。
  - "!node_modules/**"

# 上架前把平台图标放进 electron/build/ 后取消注释（Steam 商店另需 512px 图）：
# win:
#   icon: build/icon.ico
# mac:
#   icon: build/icon.icns
# linux:
#   icon: build/icon.png

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.games

linux:
  target: AppImage
  category: Game
